<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<!-- Generated by tools/board/board.mjs from {{source}}. Do not edit; edit the JSON and re-run. -->
<style>
  body { margin: 0; padding: 28px 32px 48px; background: #121417; color: #d7dbe0;
         font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #f2f4f7; font-weight: 600; }
  .sub { color: #8a929c; margin: 0 0 22px; max-width: 980px; }
  .sub a { color: #9fb4c8; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #9fb4c8;
       margin: 0 0 10px; font-weight: 600; }
  h2 .n { color: #5d6670; font-weight: 400; margin-left: 6px; }

  .group { margin-bottom: 26px; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .card { width: 300px; box-sizing: border-box; background: #1a1d22; border: 1px solid #262b31;
          border-radius: 6px; overflow: hidden; }
  .card:hover { border-color: #3a414a; }
  .card summary { display: block; cursor: pointer; list-style: none; }
  .card summary::-webkit-details-marker { display: none; }
  .card summary::marker { content: ""; }
  /* top bar in the kind colour; the id sits darker inside it, middle-left */
  .bar { height: 22px; display: flex; align-items: center; padding: 0 10px; background: #555; }
  .id { font-family: Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: .02em; color: #1e2227; }
  .k-core .id { color: #0c2419; } .k-slot .id { color: #0d1838; }
  .k-pack .id { color: #24103a; } .k-dev  .id { color: #1b1f24; }
  .k-core .bar { background: #4fa582; } .k-slot .bar { background: #5b7fe0; }
  .k-pack .bar { background: #a870dc; } .k-dev  .bar { background: #5d6670; }
  /* title row: status square on the left of the title, chevron on the right */
  .title { display: flex; align-items: center; gap: 8px; padding: 9px 12px; }
  .card h3 { margin: 0; flex: 1 1 auto; min-width: 0; font-size: 13.5px; color: #eef1f4; font-weight: 600; }
  .chev { flex: 0 0 auto; color: #5d6670; font-size: 11px; display: inline-block; transition: transform 150ms ease; }
  .chev::before { content: "\25B8"; }
  details[open] > summary .chev { transform: rotate(90deg); color: #8a929c; }
  .card .body { padding: 0 12px 10px; }
  .card p { margin: 0 0 6px; color: #aab2bb; }
  .card p b { color: #d7dbe0; font-weight: 600; }
  .ev { font: 11px/1.4 Consolas, "Cascadia Mono", monospace; color: #6f7a85; word-break: break-all; }

  /* status square: the filled rounded square is the whole status marker, no text */
  .st { width: 10px; height: 10px; border-radius: 3px; background: #9aa3ad; flex: 0 0 auto; }
  .s-doing .st  { background: #f0c674; }
  .s-done .st   { background: #4fa582; }
  .s-decide .st { background: #ff9e7a; }
  .s-decide { background: #1f1b1a; }
  .card { user-select: none; }

  /* exit test and shipped: one row per line, status square first */
  .rows { list-style: none; margin: 0; padding: 0; max-width: 980px; }
  .rows li { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; color: #aab2bb; }
  .rows li .st { position: relative; top: 1px; }
  .x-pass .st { background: #4fa582; }
  .x-fail .st { background: #e06c75; }
  .rows .ev { margin-left: auto; padding-left: 12px; }
  .shipped li { opacity: .5; }
  .shipped .id { color: #8a929c; }
</style>
</head>

{{body}}
</body>
</html>
