name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'DriftAeon/Vidar-Release'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri
            src-falcon

      - name: Install
        run: npm ci

      - name: Build frontend
        run: npm run build

      # tauri-build in src-falcon needs its frontendDist folder; build.mjs step 1 does the same copy.
      - name: Stage Falcon frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-falcon | Out-Null
          Copy-Item dist/falcon.html dist-falcon/
          Copy-Item dist/assets dist-falcon/assets -Recurse
          Copy-Item dist/icons dist-falcon/icons -Recurse

      # The test steps tee their output and, on failure, print one ::error annotation per failing
      # test (tools/gate/ci-annotate.ps1): annotations are public, job logs need auth.
      # tools/release/ci-local.ps1 runs these same run blocks locally; keep them self-contained.
      - name: Node tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $log = Join-Path ($env:RUNNER_TEMP ?? $env:TEMP) 'node-test.log'
          $env:NODE_OPTIONS = '--test-reporter=tap --test-reporter-destination=stdout'
          npm test 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE ?? 1
          if ($code -ne 0) { pwsh -NoProfile -File tools/gate/ci-annotate.ps1 -Kind node -Log $log -Title 'Node test' }
          exit $code

      - name: Cargo check (Vidar)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo check (Falcon)
        run: cargo check --manifest-path src-falcon/Cargo.toml

      - name: Cargo test (Vidar)
        id: vidar_test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $log = Join-Path ($env:RUNNER_TEMP ?? $env:TEMP) 'cargo-test-vidar.log'
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE ?? 1
          if ($code -ne 0) { pwsh -NoProfile -File tools/gate/ci-annotate.ps1 -Kind cargo -Log $log -Title 'Vidar test' }
          exit $code

      # Runs after a failed Vidar test too, so one push reports both crates.
      - name: Cargo test (Falcon)
        if: ${{ !cancelled() && steps.vidar_test.conclusion != 'skipped' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $log = Join-Path ($env:RUNNER_TEMP ?? $env:TEMP) 'cargo-test-falcon.log'
          cargo test --manifest-path src-falcon/Cargo.toml --no-fail-fast 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE ?? 1
          if ($code -ne 0) { pwsh -NoProfile -File tools/gate/ci-annotate.ps1 -Kind cargo -Log $log -Title 'Falcon test' }
          exit $code
