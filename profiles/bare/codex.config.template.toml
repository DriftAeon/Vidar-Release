# Generated by Vidar into <agentHomes>\codex-home\config.toml at every bare Codex launch, from
# profiles/bare/codex.config.template.toml (src-tauri/src/bare/home.rs). Edits here are overwritten.
# Placeholders (root, home, pwsh, payload, each in double braces) sit only inside TOML basic strings
# and are replaced by TOML-escaped values: the Vidar install root, the agentHomes folder, the pwsh
# Vidar found on its own Path, the payload text (profiles/bare/codex.payload.md). Never write one in
# a comment: it would be filled there too.

# No repo or parent-folder AGENTS.md (levers X10, X12); the user layer is gone with CODEX_HOME.
project_doc_max_bytes = 0
project_root_markers = []

# Vidar's payload, first text of the first developer message (levers X5).
developer_instructions = "{{payload}}"

# Turn-complete hook by absolute path (tools/desks/codex-notify.ps1 finds the Vidar folder itself).
# pwsh by absolute path too: the bare Path drops the WindowsApps folders so the sandboxed shell uses an
# unpackaged pwsh 7 left on Path, else Windows PowerShell 5.1 (the tab warns). notify (run outside the
# sandbox) gets that same pwsh, or the Store one when none is left; it needs pwsh 7 either way.
notify = ["{{pwsh}}", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "{{root}}\\tools\\desks\\codex-notify.ps1"]

# Explicit, not inherited from the trusted-project default.
sandbox_mode = "workspace-write"

# prefer_mxc is a chosen pin, so Codex's "Under-development features enabled" notice is noise.
suppress_unstable_features_warning = true

# Login credentials go to auth.json inside this CODEX_HOME, never the OS keyring (shared with the
# default Codex home, so a keyring login would leak across homes).
cli_auth_credentials_store = "file"

# Hosted MCP sign-ins (bareCodexMcp servers) go to .credentials.json in this CODEX_HOME too. The
# keyring entry is keyed by server name and URL with no home in it, so Bare and ~\.codex would share it.
# The hosted tables themselves are not here: Vidar appends them per spawn (src-tauri/src/bare/codex_mcp.rs).
mcp_oauth_credentials_store = "file"

[mcp_servers.vidar_drive]
# Vidar's control tools (list tabs, prompt or spawn, wait, show, ask). The one MCP server a bare tab may
# carry: home.rs pins these four keys exactly. env_vars passes the per-spawn control identity through the
# scrubbed env: VIDAR_CTL_TOKEN in-process, FALCON_SESSION + VIDAR_CTL_SECRET when Falcon hosts the tab.
command = "node"
args = ["{{root}}\\tools\\mcp\\vidar-drive\\server.mjs"]
env_vars = ["VIDAR_CTL_TOKEN", "FALCON_SESSION", "VIDAR_CTL_SECRET"]
tool_timeout_sec = 3700

[skills]
# No skills block at all: repo `.agents/skills` at the cwd still load under the two keys above.
# Vidar appends one [projects.'<launch folder, lowercased>'] table with trust_level = "trusted"
# after the last table below (home.rs), only when the user's own Codex config (%CODEX_HOME% else
# ~\.codex\config.toml) already trusts that folder, its git root, or a worktree's main repo
# (codex_user_trust.rs). A trusted folder loads its `.codex` config, hooks and exec policies over the
# Bare pins; any other folder gets no table and a Bare warning to trust it in the user's own config.
# It is the only projects table validate_codex accepts, and it is not written here.
include_instructions = false

[windows]
# Fallback tier when MXC is unavailable: restricted-token sandbox, no CodexSandbox* machine users, no UAC, no password reset.
sandbox = "unelevated"

[sandbox_workspace_write]
writable_roots = []
network_access = false
# launch.ps1 points TEMP/TMP into the fake profile, but that profile sits under the real %TEMP%; keep TEMP out of the write set.
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

[analytics]
# Telemetry off by default in Bare. Codex 0.163 reads `analytics.enabled` as a
# boolean (a string value fails config load); app-server's --analytics-default-enabled help names it as the opt-out.
enabled = false

[features]
# Never start or join the shared app-server daemon from a bare tab (levers Codex Open 1, 2).
daemon_auto_start = false
# MXC sandbox first (needs Win11 24H2/25H2 build .9278+); the [windows] unelevated sandbox is the fallback tier.
prefer_mxc = true
